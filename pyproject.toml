[project]
name = "loguru-extra"
version = "0.2.0"
description = "Ready-made loguru format and trace id propagation for sync and async code"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ABGalkin", email = "galkin88@gmail.com" }]
keywords = ["log", "loguru", "trace", "tracing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: System :: Logging",
]
requires-python = ">=3.12"
dependencies = ["loguru>=0.7.2,<0.8"]

[project.urls]
Repository = "https://github.com/galkin-anton/loguru-extra"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
